spring:
  application:
    name: QuickMeal Backend
  profiles:
    active: [local]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/quickmeal
    username: root
    password: 12345
    hikari:
      auto-commit: true
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      max-life-time: 1800000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update   # update: tự tạo bảng nếu chưa có, giữ dữ liệu cũ
    show-sql: false       # hiển thị SQL ra console
    properties:
      hibernate:
        format_sql: true # format SQL cho dễ đọc

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,application/json
    min-response-size: 1024

vnpay:
  # Giá trị thật (tmn-code/hash-secret) đặt trong application-local.yaml (gitignore, không commit)
  # vì spring.profiles.active=local đã bật sẵn ở trên nên Spring tự merge file đó vào
  tmn-code: YOUR_TMN_CODE
  hash-secret: YOUR_HASH_SECRET
  version: "2.1.0"
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  # URL backend, VNPay redirect trình duyệt khách / gọi server-to-server vào đây
  return-url: http://localhost:8080/api/payments/vnpay/return
  # Giá trị này chỉ để ghi chú - IPN URL thật phải khai báo bên VNPay Merchant Admin,
  # không được gửi kèm trong request thanh toán như return-url
  ipn-url: http://localhost:8080/api/payments/vnpay/ipn
  # URL frontend để backend redirect người dùng sau khi xử lý xong return
  frontend-return-url: http://localhost:5173/payment-result

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG        # Log chi tiết cho Spring Web
    org.hibernate.SQL: DEBUG              # Log các câu lệnh SQL
    org.hibernate.type: TRACE             # Log tham số SQL
    org.springframework.transaction: DEBUG
    org.springframework.security: DEBUG   # Log Security
 